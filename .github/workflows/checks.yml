name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Check packaging scripts
        run: |
          sh -n scripts/install.sh scripts/install-lima.sh scripts/verify-checkout.sh scripts/microvmd.sh scripts/microvmd-service.sh scripts/docker-config-signature.sh
          cargo devtool check-source
      - name: Verify installation and dependency licenses
        run: |
          mkdir "$RUNNER_TEMP/luhmen-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/luhmen-source"
          cd "$RUNNER_TEMP/luhmen-source"
          ./scripts/install.sh --prefix "$RUNNER_TEMP/luhmen-install"
          "$RUNNER_TEMP/luhmen-install/bin/luhmen" --version
          "$RUNNER_TEMP/luhmen-install/bin/luhmen" --help
          test -s "$RUNNER_TEMP/luhmen-install/share/licenses/luhmen/dependencies/index.json"
      - name: Verify Cargo source package
        run: |
          cargo package --locked
          cargo devtool check-cargo-package target/package/*.crate
