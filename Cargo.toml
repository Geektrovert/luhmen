[package]
name = "luhmen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Docker runtime for Apple Silicon Macs, powered by Lima"
repository = "https://github.com/Geektrovert/luhmen"
documentation = "https://github.com/Geektrovert/luhmen/tree/main/docs"
keywords = ["docker", "lima", "macos", "containers", "virtualization"]
categories = ["command-line-utilities", "development-tools"]
license = "Apache-2.0"
readme = "README.md"
include = ["/src/**", "/tests/**", "/scripts/**", "/docs/**", "/licenses/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY.md", "!**/__pycache__/**", "!**/*.pyc"]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
fs2 = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "signal", "time", "net", "sync", "io-util", "macros", "process"] }
tempfile = "=3.27.0"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "client-legacy", "http1"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rustls = { version = "=0.23.44", default-features = false, features = ["std", "ring", "tls12"] }
time = "=0.3.55"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
